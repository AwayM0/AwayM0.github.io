    <h1>关于这里</h1>
    <p class="article-meta">作者：繁砂</p>

    <p>这里是一个公开给朋友看的个人博客，用来放旅途、阅读、科研学习、工作月报、月度目标和日常记录。</p>
    <p>我希望它像一本随身手账：可以认真整理，也可以随手夹进票根、照片和路上遇到的风。</p>

    <h2>主要栏目</h2>
    <ul>
      <li>科研学习：文献阅读、课程笔记、问题复盘。</li>
      <li>生活随笔：旅行、月报、目标、日常记录。</li>
      <li>各种奇奇怪怪的知识：偶然遇见但不想忘掉的小东西。</li>
      <li>影集：照片、展览、美食、城市散步和路边风景。</li>
    </ul>

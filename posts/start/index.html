    <h1>重新开始写博客</h1>
    <p class="article-meta">2026-07-15 · 繁砂</p>

    <p>旧博客是用 Hexo 生成后发布到 GitHub Pages 的。换电脑之后，源工程和更新流程都不太容易找回，于是这里换成一个更简单的版本。</p>
    <p>新版博客没有复杂的构建步骤。每一篇文章都是一个普通网页，样式集中放在一个文件里。想写新文章时，只要复制模板，改标题、日期和正文，再把链接加到首页和归档页即可。</p>

    <h2>给未来的自己</h2>
    <p>博客先不要追求复杂。先写下来，先留下来。样式、分类、标签、评论，都可以等内容变多以后再说。</p>
